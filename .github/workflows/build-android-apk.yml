name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instal dependensi
        run: npm ci

      - name: Siapkan mesin cetak gambar
        run: mkdir -p www/vendor && cp node_modules/html2canvas/dist/html2canvas.min.js www/vendor/html2canvas.min.js

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Siapkan kunci tanda tangan tetap
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 belum diatur. Lihat petunjuk di README build."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/transaku-release.jks"

      - name: Build APK yang dapat diperbarui
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/transaku-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: bash ./gradlew assembleDebug

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: Transaku-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
